name: PowerPilot CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powerpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve build identity
        id: build
        shell: pwsh
        run: |
          $src = Get-Content app/main.go -Raw
          if ($src -notmatch 'const appVersion = "([^"]+)"') { throw 'appVersion not found' }
          $baseVersion = $Matches[1]
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/develop') {
            $channel = 'develop'
            $version = "$baseVersion-dev.${{ github.run_number }}"
          } else {
            $channel = 'stable'
            $version = $baseVersion
          }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and validate release
        env:
          POWERPILOT_CHANNEL: ${{ steps.build.outputs.channel }}
          POWERPILOT_BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: python build_release.py

      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PowerPilot-${{ steps.build.outputs.version }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish rolling develop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.build.outputs.version }}'
          $notes = "powerpilot-develop-version: $version`n`nАвтоматическая тестовая сборка ветки develop. Может содержать незавершённые функции."
          gh release view develop *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH repos/${{ github.repository }}/git/refs/tags/develop -f sha=${{ github.sha }} -F force=true
          } else {
            gh release create develop --prerelease --target '${{ github.sha }}' --title "PowerPilot Develop $version" --notes "$notes"
          }
          gh release upload develop release/PowerPilot_Develop_Setup.exe release/PowerPilot_Develop_Portable.exe release/PowerPilot_Develop_Update.zip --clobber
          gh release edit develop --prerelease --title "PowerPilot Develop $version" --notes "$notes"
