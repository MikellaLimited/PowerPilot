name: Build and publish PowerPilot release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path app/main.go -Pattern 'const appVersion = "([^"]+)"'
          if (-not $m) { throw 'appVersion not found' }
          $version = $m.Matches.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows x64 release
        shell: pwsh
        run: python build_release.py

      - name: Verify six release assets
        shell: pwsh
        run: |
          $v='${{ steps.version.outputs.version }}'
          $assets=@(
            "release/PowerPilot_Setup_$v.exe",
            "release/PowerPilot_Portable_$v.exe",
            "release/PowerPilot_Update_$v.zip",
            "release/PowerPilot_${v}_source.zip",
            "release/PowerPilot_${v}_RELEASE_NOTES.txt",
            "release/PowerPilot_${v}_release_validation.json"
          )
          foreach($a in $assets){ if(-not (Test-Path $a)){ throw "Missing release asset: $a" } }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerPilot-${{ steps.version.outputs.version }}
          path: release/PowerPilot_*

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v='${{ steps.version.outputs.version }}'
          $tag="v$v"
          $assets=@(
            "release/PowerPilot_Setup_$v.exe",
            "release/PowerPilot_Portable_$v.exe",
            "release/PowerPilot_Update_$v.zip",
            "release/PowerPilot_${v}_source.zip",
            "release/PowerPilot_${v}_RELEASE_NOTES.txt",
            "release/PowerPilot_${v}_release_validation.json"
          )
          if(gh release view $tag 2>$null){
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "PowerPilot $v" --notes-file "release/PowerPilot_${v}_RELEASE_NOTES.txt"
          }
