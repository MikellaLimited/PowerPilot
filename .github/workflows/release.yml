name: PowerPilot Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.8.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore PowerPilot source bundle
        shell: pwsh
        run: |
          if (Test-Path 'bootstrap/powerpilot-source.tar.gz') {
            tar -xzf bootstrap/powerpilot-source.tar.gz -C .
          }
          if (!(Test-Path 'app/main.go')) { throw 'PowerPilot source bundle was not restored' }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v='${{ inputs.version }}'.TrimStart('v','V')
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $v='${{ github.ref_name }}'.TrimStart('v','V')
          } else {
            $src = Get-Content app/main.go -Raw
            if ($src -notmatch 'const appVersion = "([^"]+)"') { throw 'appVersion not found' }
            $v=$Matches[1]
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          $src = Get-Content app/main.go -Raw
          if ($src -notmatch ('const appVersion = "' + [regex]::Escape($v) + '"')) {
            throw "appVersion in source does not match release version $v"
          }

      - name: Prepare pinned hardware-monitor provider
        run: python prepare_build_assets.py

      - name: Build and validate release
        run: python build_release.py

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerPilot-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v='${{ steps.version.outputs.version }}'
          $tag="v$v"
          $notes="release/PowerPilot_${v}_RELEASE_NOTES.txt"
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "PowerPilot $v" --notes-file $notes --target $env:GITHUB_SHA
          }
