name: PowerPilot Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.8.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: powerpilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v='${{ inputs.version }}'.TrimStart('v','V')
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $v='${{ github.ref_name }}'.TrimStart('v','V')
          } else {
            $src = Get-Content app/main.go -Raw
            if ($src -notmatch 'const appVersion = "([^"]+)"') { throw 'appVersion not found' }
            $v=$Matches[1]
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          $src = Get-Content app/main.go -Raw
          if ($src -notmatch ('const appVersion = "' + [regex]::Escape($v) + '"')) {
            throw "appVersion in source does not match release version $v"
          }

      - name: Build and validate release
        run: python build_release.py

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PowerPilot-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v='${{ steps.version.outputs.version }}'
          $tag="v$v"
          $notes="release/PowerPilot_${v}_RELEASE_NOTES.txt"
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "PowerPilot $v" --notes-file $notes --target $env:GITHUB_SHA
          }
